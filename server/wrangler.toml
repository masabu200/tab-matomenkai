# Cloudflare Workers config for the Tab Matomen Kai billing worker.
# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
name = "tab-matomen-billing"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGINS = "chrome-extension://ofpnbokbnlfjglogdhoegmiallanobdb"
PUBLIC_URL = "https://tab-matomen-billing.kws-toolskws-toolskws-toolskws-tools.workers.dev"
STRIPE_PRICE_ID = "price_1UVoGbRvCR021e0tYfNTWWdg"
MANAGED_PAYMENTS = "true"

[[kv_namespaces]]
binding = "BILLING"
id = "d64bccbe884241da9ea30a69be884d8e"

# Public legal pages (privacy, terms, 特商法) built from store/*.md by tools/build-legal.cjs
[assets]
directory = "./public"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
